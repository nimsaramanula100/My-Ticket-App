name: mytickets_app
description: A mobile ticket booking app built with Flutter and Firebase, similar to mytickets.lk
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase packages
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_database: ^10.0.0
  # App Check to provide App Check tokens for Firebase services during development
  firebase_app_check: ^0.2.2
  
  # State management
  provider: ^6.0.0
  
  # UI and navigation
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  flutter_svg: ^2.0.5
  
  # HTTP requests
  http: ^1.1.0
  
  # Local storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # Date and time
  timeago: ^3.6.0
  
  # Animations
  flutter_staggered_animations: ^1.1.1
  
  # Payment processing (optional)
  razorpay_flutter: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
  
  # Fonts
  # Fonts: removed local Roboto assets (not present). System fonts will be used.
