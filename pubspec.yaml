name: mytickets_app
description: MyTicket.lk — Sri Lanka's premier mobile ticketing platform. Two-sided app for ticket buyers and event organizers.
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  firebase_app_check: ^0.2.2

  # State management
  provider: ^6.0.0

  # Navigation
  go_router: ^13.2.5

  # UI & Fonts
  cupertino_icons: ^1.0.2
  google_fonts: ^6.3.3
  flutter_svg: ^2.0.5
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Animations
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.7

  # Image Picker (event banner upload)
  image_picker: ^1.0.4

  # Charts (organizer analytics)
  fl_chart: ^0.66.2

  # Utils
  intl: ^0.19.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  timeago: ^3.6.0
  uuid: ^4.3.3

  # Google Maps (venue picker)
  google_maps_flutter: ^2.5.3
  geocoding: ^3.0.0

  # Payment
  razorpay_flutter: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
